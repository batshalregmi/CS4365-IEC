services:
  metabase:
    image: metabase/metabase:latest
    container_name: metabase
    ports:
      - "3001:3000"
    environment:
      - MB_DB_TYPE=postgres
      - MB_DB_DBNAME=metabase
      - MB_DB_PORT=5432
      - MB_DB_USER=postgres
      - MB_DB_PASS=test
      - MB_DB_HOST=timescale
    depends_on:
      - timescale
    restart: unless-stopped

  timescale:
    image: timescale/timescaledb:latest-pg18
    container_name: timescale
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=test
      - POSTGRES_DB=postgres
      - PGDATA=/pgdata
    command: >
      postgres
      -c listen_addresses='*'
      -c wal_level=replica
    volumes:
      - ./timescale_data:/pgdata
    restart: unless-stopped